<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Warehouse Dashboard</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <header class="header">
      <div>
        <h1>Warehouse Dashboard</h1>
        <p>ระบบ Dashboard เชื่อม Google Sheet API และ Deploy ผ่าน Netlify</p>
      </div>
    </header>

    <section class="cards">
      <div class="card">
        <p>งานทั้งหมด</p>
        <h2 id="totalCount">0</h2>
      </div>

      <div class="card warning">
        <p>รอดำเนินการ</p>
        <h2 id="pendingCount">0</h2>
      </div>

      <div class="card success">
        <p>เสร็จแล้ว</p>
        <h2 id="doneCount">0</h2>
      </div>

      <div class="card danger">
        <p>ยกเลิก</p>
        <h2 id="cancelCount">0</h2>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>รายการแจ้งปัญหา</h2>

        <div class="filter-group">
          <input
            id="searchInput"
            type="text"
            placeholder="ค้นหา Ticket, สาขา, สินค้า, สถานะ..."
          />

          <select id="statusFilter">
            <option value="ทั้งหมด">ทั้งหมด</option>
            <option value="รอดำเนินการ">รอดำเนินการ</option>
            <option value="เสร็จแล้ว">เสร็จแล้ว</option>
            <option value="ยกเลิก">ยกเลิก</option>
          </select>

          <input
            id="startDate"
            type="date"
            title="วันที่เริ่มต้น"
          />

          <input
            id="endDate"
            type="date"
            title="วันที่สิ้นสุด"
          />

          <button id="clearFilterBtn" type="button">
            ล้าง Filter
          </button>
        </div>
      </div>

      <div class="filter-note">
        เลือกช่วงวันที่เพื่อกรองข้อมูลร่วมกับสถานะและช่องค้นหา
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Ticket ID</th>
              <th>วันที่</th>
              <th>สาขา</th>
              <th>สินค้า</th>
              <th>ประเภทปัญหา</th>
              <th>สถานะ</th>
            </tr>
          </thead>
          <tbody id="ticketTable"></tbody>
        </table>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
